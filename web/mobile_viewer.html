<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>HLL Mobile Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08111f;
      --panel: rgba(6, 16, 30, 0.88);
      --line: rgba(115, 197, 255, 0.18);
      --text: #eef5ff;
      --muted: #8ea6bf;
      --accent: #71d8ff;
      --ok: #66f0a9;
      --warn: #ffcd70;
      --sidebar-w: 270px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #09111f 0%, #050912 100%);
      color: var(--text);
      font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
      overflow: hidden;
    }

    /* ── Login Screen ── */
    #loginScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(38, 79, 145, 0.32), transparent 38%),
        linear-gradient(180deg, #09111f 0%, #050912 100%);
      z-index: 10;
    }

    .login-card {
      width: min(340px, 90vw);
      padding: 32px 24px 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
      display: grid;
      gap: 14px;
      text-align: center;
    }

    .login-card h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .login-card h2 {
      margin: -6px 0 4px;
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .login-card input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(144, 186, 255, 0.2);
      background: rgba(6, 14, 28, 0.9);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      text-align: center;
    }

    .login-card button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      background: linear-gradient(135deg, #0eb7f0, #5df2c5);
      color: #04111f;
      font: inherit;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .login-card button:active {
      opacity: 0.85;
    }

    .login-status {
      font-size: 12px;
      min-height: 18px;
    }

    /* ── Main Screen ── */
    #mainScreen {
      display: none;
      width: 100%;
      height: 100%;
      position: relative;
    }

    #mainScreen.visible {
      display: flex;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      height: 100%;
      overflow-y: auto;
      background: var(--panel);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      gap: 0;
      z-index: 5;
      padding: 10px 0;
    }

    .sidebar-section {
      padding: 10px 16px;
    }

    .sidebar-section + .sidebar-section {
      border-top: 1px solid var(--line);
    }

    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .metric {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 3px 0;
      font-size: 13px;
    }

    .metric .key {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .metric .val {
      color: var(--text);
      font-weight: 600;
    }

    .val.ok { color: var(--ok); }
    .val.warn { color: var(--warn); }
    .val.err { color: #ff7070; }

    /* ── Canvas ── */
    #scene {
      flex: 1;
      display: block;
      touch-action: none;
      min-width: 0;
    }
  </style>
</head>
<body>

  <!-- ── Login Screen ── -->
  <div id="loginScreen">
    <div class="login-card">
      <h1>HLL Artillery</h1>
      <h2>Mobile Viewer</h2>
      <input id="peerInput" value="__DEFAULT_PEER_ID__" spellcheck="false" autocomplete="off" placeholder="Peer ID">
      <button id="connectBtn" type="button">Connect</button>
      <div class="login-status" id="loginStatus"></div>
    </div>
  </div>

  <!-- ── Main Screen ── -->
  <div id="mainScreen">
    <div id="sidebar">
      <div class="sidebar-section">
        <div class="section-title">Telemetry</div>
        <div class="metric"><span class="key">Mode</span><span class="val" id="modeValue">-</span></div>
        <div class="metric"><span class="key">Distance</span><span class="val" id="distanceValue">-</span></div>
        <div class="metric"><span class="key">Azimuth</span><span class="val" id="azimuthValue">-</span></div>
        <div class="metric"><span class="key">MIL</span><span class="val" id="milValue">-</span></div>
        <div class="metric"><span class="key">Relative</span><span class="val" id="relativeValue">-</span></div>
        <div class="metric"><span class="key">Tilt</span><span class="val" id="tiltValue">-</span></div>
        <div class="metric"><span class="key">State Seq</span><span class="val" id="seqValue">-</span></div>
      </div>
      <div class="sidebar-section">
        <div class="section-title">Connection</div>
        <div class="metric"><span class="key">Status</span><span class="val" id="statusText">-</span></div>
        <div class="metric"><span class="key">Peer</span><span class="val" id="peerText">__DEFAULT_PEER_ID__</span></div>
      </div>
      <div class="sidebar-section">
        <div class="section-title">Diagnostics</div>
        <div class="metric"><span class="key">ICE</span><span class="val" id="iceState">-</span></div>
        <div class="metric"><span class="key">Elapsed</span><span class="val" id="connTimer">0s</span></div>
        <div class="metric"><span class="key">Error</span><span class="val" id="lastError">-</span></div>
      </div>
    </div>
    <canvas id="scene"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script>
    const signalConfig = {
      host: "__SIGNAL_HOST__",
      port: Number("__SIGNAL_PORT__"),
      path: "__SIGNAL_PATH__",
      secure: __SIGNAL_SECURE__,
    };

    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const loginScreen = document.getElementById("loginScreen");
    const mainScreen = document.getElementById("mainScreen");
    const sidebar = document.getElementById("sidebar");
    const loginStatus = document.getElementById("loginStatus");
    const statusText = document.getElementById("statusText");
    const peerText = document.getElementById("peerText");
    const peerInput = document.getElementById("peerInput");
    const connectBtn = document.getElementById("connectBtn");
    const metrics = {
      mode: document.getElementById("modeValue"),
      distance: document.getElementById("distanceValue"),
      azimuth: document.getElementById("azimuthValue"),
      mil: document.getElementById("milValue"),
      relative: document.getElementById("relativeValue"),
      tilt: document.getElementById("tiltValue"),
      seq: document.getElementById("seqValue"),
    };

    const stateCache = {
      seq: 0,
      payload: null,
      assets: {
        base_map: null,
        overlay: null,
      },
    };

    const viewport = {
      scale: 1,
      offsetX: 0,
      offsetY: 0,
      dragging: false,
      pointers: new Map(),
      pinchStartDistance: 0,
      pinchStartScale: 1,
      dragStartOffsetX: 0,
      dragStartOffsetY: 0,
      dragStartX: 0,
      dragStartY: 0,
    };

    let peer = null;
    let connection = null;
    let connTimerId = null;
    let connStartMs = 0;
    const iceStateEl = document.getElementById("iceState");
    const connTimerEl = document.getElementById("connTimer");
    const lastErrorEl = document.getElementById("lastError");

    function setIceState(state) {
      iceStateEl.textContent = state || "-";
      iceStateEl.className = "val " + (
        state === "connected" || state === "completed" ? "ok" :
        state === "failed" || state === "disconnected" ? "err" : "warn"
      );
    }

    function setLastError(msg) {
      lastErrorEl.textContent = msg || "-";
    }

    function startConnTimer() {
      connStartMs = Date.now();
      connTimerEl.textContent = "0s";
      if (connTimerId) clearInterval(connTimerId);
      connTimerId = setInterval(() => {
        const sec = Math.floor((Date.now() - connStartMs) / 1000);
        connTimerEl.textContent = `${sec}s`;
      }, 1000);
    }

    function stopConnTimer() {
      if (connTimerId) {
        clearInterval(connTimerId);
        connTimerId = null;
      }
    }

    function monitorIceState(conn) {
      let pc = null;
      try {
        pc = conn.peerConnection || (conn._connection && conn._connection.peerConnection) || null;
      } catch (_) {}
      if (!pc) {
        setIceState("(unavailable)");
        return;
      }
      setIceState(pc.iceConnectionState || "unknown");
      pc.addEventListener("iceconnectionstatechange", () => {
        setIceState(pc.iceConnectionState);
      });
    }

    function getCanvasSize() {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      return { w: Math.floor(w * dpr), h: Math.floor(h * dpr), cssW: w, cssH: h, dpr: dpr };
    }

    function resizeCanvas() {
      const { w, h, cssW, cssH, dpr } = getCanvasSize();
      if (w <= 0 || h <= 0) return;
      canvas.width = w;
      canvas.height = h;
      canvas.style.width = `${cssW}px`;
      canvas.style.height = `${cssH}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function setStatus(text, mode) {
      statusText.textContent = text || "-";
      statusText.className = "val " + (mode === "ok" ? "ok" : mode === "err" ? "err" : "warn");
      // Also show brief status on login screen if visible
      if (loginScreen.style.display !== "none") {
        loginStatus.textContent = text || "";
        loginStatus.style.color = mode === "ok" ? "var(--ok)" : mode === "err" ? "#ff7070" : "var(--warn)";
      }
    }

    function resetPeer() {
      stopConnTimer();
      if (connection) {
        connection.close();
        connection = null;
      }
      if (peer) {
        peer.destroy();
        peer = null;
      }
      setIceState("-");
      setLastError("-");
      for (const key in chunkBuffers) {
        delete chunkBuffers[key];
      }
    }

    function showMainScreen() {
      loginScreen.style.display = "none";
      mainScreen.classList.add("visible");
      resizeCanvas();
    }

    function showLoginScreen() {
      mainScreen.classList.remove("visible");
      loginScreen.style.display = "flex";
      setStatus("Connection closed", "warn");
    }

    function connectToSource() {
      const targetPeer = (new URLSearchParams(window.location.search).get("peer") || peerInput.value || "").trim();
      if (!targetPeer) {
        setStatus("Peer ID is required", "warn");
        return;
      }

      resetPeer();
      peerText.textContent = targetPeer;
      setStatus("Connecting to signaling server...", "warn");
      setIceState("connecting");
      setLastError("-");
      startConnTimer();

      peer = new Peer(undefined, { ...signalConfig, debug: 3 });

      peer.on("open", () => {
        setStatus("Peer ready, opening data channel...", "warn");
        setIceState("checking");
        connection = peer.connect(targetPeer, {
          reliable: true,
          serialization: "json",
        });
        bindConnection();
      });

      peer.on("error", (error) => {
        const msg = String(error);
        setStatus(`Peer error: ${msg}`, "err");
        setLastError(msg);
        setIceState("failed");
        stopConnTimer();
      });

      peer.on("disconnected", () => {
        setStatus("Peer disconnected from signaling", "warn");
        setIceState("disconnected");
        stopConnTimer();
      });
    }

    function bindConnection() {
      if (!connection) {
        return;
      }

      monitorIceState(connection);

      connection.on("open", () => {
        setStatus("Connected", "ok");
        setIceState("connected");
        stopConnTimer();
        showMainScreen();
      });

      connection.on("data", (message) => {
        handleMessage(message);
      });

      connection.on("close", () => {
        setStatus("Connection closed", "warn");
        setIceState("closed");
        stopConnTimer();
        showLoginScreen();
      });

      connection.on("error", (error) => {
        const msg = String(error);
        setStatus(`Connection error: ${msg}`, "err");
        setLastError(msg);
        setIceState("failed");
        stopConnTimer();
      });
    }

    const chunkBuffers = {};
    let msgLog = [];

    function handleMessage(message) {
      if (!message || typeof message !== "object") {
        console.warn("[HLL-DIAG] handleMessage: non-object", typeof message);
        return;
      }

      const t = message.type || "?";
      const key = t;
      if (!msgLog[key]) msgLog[key] = 0;
      msgLog[key]++;
      if (msgLog[key] <= 3) {
        if (t === "asset_chunk") {
          console.log(`[HLL-DIAG] recv #${msgLog[key]}: type=${t} name=${message.name} idx=${message.index}/${message.total} data_len=${(message.data||"").length}`);
        } else if (t === "state") {
          console.log(`[HLL-DIAG] recv #${msgLog[key]}: type=${t} seq=${message.seq} hasPayload=${!!message.payload}`);
        } else {
          console.log(`[HLL-DIAG] recv #${msgLog[key]}: type=${t}`, message);
        }
      }

      if (message.type === "hello") {
        setStatus("Connected", "ok");
        console.log("[HLL-DIAG] hello received, connection established");
        return;
      }

      if (message.type === "asset") {
        console.log(`[HLL-DIAG] legacy asset: name=${message.name} data_len=${(message.data||"").length}`);
        loadAsset(message.name, message.mimeType, message.data);
        return;
      }

      if (message.type === "asset_chunk") {
        handleAssetChunk(message);
        return;
      }

      if (message.type === "clear_asset") {
        console.log(`[HLL-DIAG] clear_asset: name=${message.name}`);
        delete chunkBuffers[message.name];
        stateCache.assets[message.name] = null;
        draw();
        return;
      }

      if (message.type === "state") {
        stateCache.seq = message.seq || stateCache.seq;
        stateCache.payload = message.payload;
        updateMetricPanel();
        draw();
      }
    }

    function handleAssetChunk(message) {
      let entry = chunkBuffers[message.name];
      if (!entry) {
        console.log(`[HLL-DIAG] chunk start: name=${message.name} total=${message.total} mime=${message.mimeType}`);
        entry = {
          chunks: [],
          total: message.total,
          mimeType: message.mimeType,
          received: 0,
        };
        chunkBuffers[message.name] = entry;
      }

      if (entry.total !== message.total) {
        console.warn(`[HLL-DIAG] chunk total mismatch for ${message.name}: was ${entry.total} now ${message.total}, resetting`);
        entry.chunks = [];
        entry.total = message.total;
        entry.received = 0;
      }

      if (entry.chunks[message.index] !== undefined) {
        console.warn(`[HLL-DIAG] chunk dup: name=${message.name} idx=${message.index}`);
        return;
      }

      entry.chunks[message.index] = message.data;
      entry.received++;

      if (entry.received % 10 === 0 || entry.received === entry.total) {
        console.log(`[HLL-DIAG] chunk progress: name=${message.name} ${entry.received}/${entry.total}`);
      }

      if (entry.received === entry.total) {
        const fullData = entry.chunks.join("");
        console.log(`[HLL-DIAG] chunk complete: name=${message.name} total_len=${fullData.length} chunks=${entry.total}`);
        delete chunkBuffers[message.name];
        loadAsset(message.name, entry.mimeType, fullData);
      }
    }

    function loadAsset(name, mimeType, base64Data) {
      console.log(`[HLL-DIAG] loadAsset: name=${name} mime=${mimeType} b64_len=${(base64Data||"").length}`);
      const image = new Image();
      image.onload = () => {
        console.log(`[HLL-DIAG] image loaded OK: name=${name} w=${image.naturalWidth} h=${image.naturalHeight}`);
        stateCache.assets[name] = image;
        draw();
      };
      image.onerror = (e) => {
        console.error(`[HLL-DIAG] image load FAILED: name=${name} src_preview=${image.src.substring(0,80)}`);
      };
      image.src = `data:${mimeType};base64,${base64Data}`;
    }

    function updateMetricPanel() {
      const payload = stateCache.payload;
      if (!payload) {
        return;
      }

      metrics.mode.textContent = payload.mode || "-";
      metrics.distance.textContent = `${payload.view.distanceM.toFixed(1)} m`;
      metrics.azimuth.textContent = `${payload.view.azimuthDeg.toFixed(1)} deg`;
      metrics.mil.textContent = payload.view.mil.toFixed(2);
      metrics.relative.textContent = `${payload.view.relativeAngleDeg.toFixed(1)} deg`;
      metrics.tilt.textContent = `${(payload.view.tiltAngleDeg || 0).toFixed(1)}°`;
      metrics.seq.textContent = String(stateCache.seq || 0);
    }

    function draw() {
      const { cssW, cssH } = getCanvasSize();
      if (cssW <= 0 || cssH <= 0) return;

      ctx.clearRect(0, 0, cssW, cssH);
      const payload = stateCache.payload;
      if (!payload) {
        drawEmptyMessage(cssW);
        return;
      }

      ctx.save();
      ctx.translate(viewport.offsetX, viewport.offsetY);
      ctx.scale(viewport.scale, viewport.scale);

      const mapWidth = payload.map.widthPx || 1;
      const mapHeight = payload.map.heightPx || 1;
      const baseMap = stateCache.assets.base_map;
      const overlay = stateCache.assets.overlay;

      if (baseMap) {
        ctx.drawImage(baseMap, 0, 0, mapWidth, mapHeight);
      } else {
        ctx.fillStyle = "#182433";
        ctx.fillRect(0, 0, mapWidth, mapHeight);
      }

      if (overlay) {
        ctx.save();
        ctx.globalAlpha = payload.view.overlayOpacity || 0.5;
        ctx.drawImage(overlay, 0, 0, mapWidth, mapHeight);
        ctx.restore();
      }

      const a = denormalize(payload.entities.a, mapWidth, mapHeight);
      const b = denormalize(payload.entities.b, mapWidth, mapHeight);
      if (a) {
        drawSector(a, payload.view.headingDeg, payload.view.sectorAngleDeg, payload.view.sectorRadiusNorm * mapWidth);
      }
      if (a && b) {
        drawLine(a, b);
        drawPoint(b.x, b.y, 30, "rgba(255, 0, 0, 0.72)");
      }
      if (a) {
        drawPoint(a.x, a.y, 25, "rgba(0, 255, 0, 0.8)");
      }

      ctx.restore();
    }

    function drawEmptyMessage(canvasW) {
      ctx.save();
      ctx.fillStyle = "rgba(255,255,255,0.72)";
      ctx.font = "15px SF Mono, monospace";
      ctx.fillText("Waiting for synchronized map state...", 20, 40);
      ctx.restore();
    }

    function drawSector(origin, headingDeg, sectorAngleDeg, radiusPx) {
      if (headingDeg == null) {
        return;
      }

      ctx.beginPath();
      ctx.moveTo(origin.x, origin.y);
      const start = degToRad(headingDeg - sectorAngleDeg);
      const end = degToRad(headingDeg + sectorAngleDeg);
      for (let step = 0; step <= 60; step += 1) {
        const angle = start + ((end - start) * step) / 60;
        const x = origin.x + Math.sin(angle) * radiusPx;
        const y = origin.y - Math.cos(angle) * radiusPx;
        ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = "rgba(60, 170, 255, 0.26)";
      ctx.fill();
    }

    function drawLine(a, b) {
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(70, 160, 255, 0.9)";
      ctx.stroke();
    }

    function drawPoint(x, y, radius, color) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }

    function denormalize(point, width, height) {
      if (!point) {
        return null;
      }
      return {
        x: point.x * width,
        y: point.y * height,
      };
    }

    function degToRad(value) {
      return (value * Math.PI) / 180;
    }

    function pointerDistance() {
      const points = [...viewport.pointers.values()];
      if (points.length < 2) {
        return 0;
      }
      const dx = points[0].x - points[1].x;
      const dy = points[0].y - points[1].y;
      return Math.hypot(dx, dy);
    }

    canvas.addEventListener("pointerdown", (event) => {
      canvas.setPointerCapture(event.pointerId);
      viewport.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (viewport.pointers.size === 1) {
        viewport.dragging = true;
        viewport.dragStartX = event.clientX;
        viewport.dragStartY = event.clientY;
        viewport.dragStartOffsetX = viewport.offsetX;
        viewport.dragStartOffsetY = viewport.offsetY;
      } else if (viewport.pointers.size === 2) {
        viewport.pinchStartDistance = pointerDistance();
        viewport.pinchStartScale = viewport.scale;
      }
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!viewport.pointers.has(event.pointerId)) {
        return;
      }
      viewport.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

      if (viewport.pointers.size === 1 && viewport.dragging) {
        viewport.offsetX = viewport.dragStartOffsetX + (event.clientX - viewport.dragStartX);
        viewport.offsetY = viewport.dragStartOffsetY + (event.clientY - viewport.dragStartY);
        draw();
      } else if (viewport.pointers.size >= 2) {
        const distance = pointerDistance();
        if (viewport.pinchStartDistance > 0) {
          const nextScale = viewport.pinchStartScale * (distance / viewport.pinchStartDistance);
          viewport.scale = Math.min(Math.max(nextScale, 0.2), 6);
          draw();
        }
      }
    });

    function releasePointer(pointerId) {
      viewport.pointers.delete(pointerId);
      if (viewport.pointers.size === 0) {
        viewport.dragging = false;
      }
      if (viewport.pointers.size < 2) {
        viewport.pinchStartDistance = 0;
      }
    }

    canvas.addEventListener("pointerup", (event) => releasePointer(event.pointerId));
    canvas.addEventListener("pointercancel", (event) => releasePointer(event.pointerId));

    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      const delta = event.deltaY < 0 ? 1.08 : 0.92;
      viewport.scale = Math.min(Math.max(viewport.scale * delta, 0.2), 6);
      draw();
    }, { passive: false });

    connectBtn.addEventListener("click", connectToSource);
    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();

    const initialPeer = new URLSearchParams(window.location.search).get("peer") || "__DEFAULT_PEER_ID__";
    if (initialPeer && initialPeer !== "__DEFAULT_PEER_ID__") {
      peerInput.value = initialPeer;
      connectToSource();
    }
  </script>
</body>
</html>
